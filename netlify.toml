# Netlify build config.
#
# Dependency installation is handled by Netlify's own "Installing dependencies"
# stage, which runs a plain `npm install` *before* the command below. Flags
# added here would come too late — the npm settings that matter live in
# .npmrc, which every npm invocation reads. See that file for why
# legacy-peer-deps is required.
#
# This used to run `rm -f package-lock.json && npm install` to dodge
# npm/cli#4828, where a macOS-generated lockfile could omit Rollup's Linux
# binary. That deletion is unnecessary: package-lock.json isn't committed at
# all (see .gitignore), so the build container already resolves from scratch.
#
# Worth revisiting as a team: committing the lockfile and using `npm ci` would
# make builds reproducible and stop every deploy silently resolving a
# different vue-router than was tested locally. Current npm writes all
# platform binaries into the lockfile, rollup-linux-x64-gnu included, so the
# original reason for ignoring it no longer holds.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # Belt and braces: Netlify passes this to its own install step, so the build
  # stays green even if .npmrc is ever lost or overridden.
  NPM_FLAGS = "--legacy-peer-deps"
