# Netlify build config.
#
# package-lock.json is deliberately not committed (see .gitignore), so every
# build resolves the dependency tree from scratch on the Linux container.
#
# On npm 10.9.8 that fresh resolve crashes arborist:
#   npm error Cannot read properties of null (reading 'edgesOut')
# Reproducible locally with the same npm version from package.json alone, so
# it isn't a Netlify cache or environment issue.
#
# The trigger is vue-router. package.json asks for ^5.0.6; with no lockfile
# that floats to 5.2.0, which declares peer dependencies on pinia,
# @pinia/colada and vite — none of which this project has. npm then dies
# building the peer graph instead of reporting a conflict.
#
# --legacy-peer-deps skips that peer resolution and installs cleanly (verified
# against this exact package.json).
#
# Better long-term fix: commit package-lock.json and use `npm ci`. The reason
# it's ignored — npm/cli#4828, where a macOS-generated lockfile omitted
# Rollup's Linux binary — no longer applies: a lockfile generated by current
# npm carries every platform binary, rollup-linux-x64-gnu included. That would
# also stop each deploy silently resolving a different vue-router than was
# tested locally. Left as a team decision rather than changed here.
[build]
  command = "npm install --legacy-peer-deps && npm run build"

[build.environment]
  NODE_VERSION = "22"
