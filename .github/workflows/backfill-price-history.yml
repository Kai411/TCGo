name: Backfill price history

# Slowly fills card_prices.history back to February 2024 from TCGCSV's daily
# TCGPlayer price archive (scripts/backfill-price-history.mjs). Each run does
# the next 30 days not done yet, newest first, and records them in Supabase's
# price_backfill_days table. Once every day is done a run does nothing and
# prints COMPLETE; this file can then be deleted.
#
# Needs the SQL from the PR pasted into Supabase first. Scheduled runs only
# fire from the default branch (main).

on:
  schedule:
    # Kept well clear of the nightly jobs (seed 21:00, prices 22:00,
    # Cardmarket 23:00 UTC). The backfill's merge
    # and the nightly snapshot both rewrite each card's history, so they
    # must never run at the same time.
    #   02:30 UTC = 10:30, 08:30 UTC = 16:30, 14:30 UTC = 22:30 Malaysia time
    - cron: "30 2,8,14 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Days to backfill in this run"
        default: "30"

concurrency:
  group: backfill-price-history
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --no-audit --no-fund

      - name: Backfill the next days
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Pauses (no writes) above this. 450 keeps clear of the free plan's
          # 500 MB; raise it on a bigger plan.
          BACKFILL_MAX_DB_MB: "450"
          DAYS: ${{ github.event.inputs.days || '30' }}
        run: node scripts/backfill-price-history.mjs --chunk "$DAYS" --yes
